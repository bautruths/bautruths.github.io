<style>
:root{
  --ground:#0D0D0D; --surface:#16120E; --rule:#2C241C; --rule-strong:#453729;
  --copper:#B87333; --copper-hi:#D89A5C; --on-copper:#0D0D0D;
  --text:#F2EBE0; --muted:#9C8F80;
}
@media (prefers-color-scheme: light){
  :root{
    --ground:#FAF6EF; --surface:#FFFFFF; --rule:#E1D8C9; --rule-strong:#C7B9A4;
    --copper:#8A551F; --copper-hi:#6D4116; --on-copper:#FFF6E9;
    --text:#17130F; --muted:#6B6155;
  }
}
*{box-sizing:border-box}
html{color-scheme:light dark;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  background:var(--ground);
  background-image:radial-gradient(115% 46vh at 50% 0,rgba(184,115,51,.17),transparent 72%);
  background-repeat:no-repeat;
  color:var(--text);
  font-family:"Newsreader",Georgia,"Times New Roman",serif;
  font-size:17px;line-height:1.58;
  padding:2rem 1.2rem;
}
.caja{width:min(100%,24rem);text-align:center}
.cara{
  width:76px;height:76px;border-radius:50%;object-fit:cover;
  border:2px solid var(--copper);box-shadow:0 0 0 5px rgba(184,115,51,.1);
  margin-bottom:1.1rem;
}
.marca{
  font-family:"Archivo Black",Impact,sans-serif;
  font-size:.9rem;letter-spacing:.24em;margin:0 0 1.4rem;
}
.marca span{color:var(--copper)}
h1{
  font-family:"Archivo Black",Impact,sans-serif;
  font-size:clamp(1.6rem,8vw,2.1rem);line-height:1.08;margin:0 0 .7rem;
}
p{margin:0 0 1.5rem;color:var(--muted)}
.cta{
  display:block;background:var(--copper);color:var(--on-copper);
  font-family:"Archivo Black",Impact,sans-serif;font-size:1rem;
  text-align:center;text-decoration:none;
  padding:1rem .9rem;border-radius:10px;
  transition:background .18s ease,transform .14s ease;
}
.cta:hover,.cta:focus-visible{background:var(--copper-hi)}
.cta:active{transform:translateY(1px)}
.otra{
  display:inline-block;margin-top:1rem;
  font-family:"Archivo",system-ui,sans-serif;font-size:.82rem;
  color:var(--copper);text-decoration:none;
  border-bottom:1px solid var(--rule-strong);
}
:focus-visible{outline:2px solid var(--copper);outline-offset:3px}
a,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
</style>
</head>
